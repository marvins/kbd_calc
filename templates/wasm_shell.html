<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overboard Calculator</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #1a1a1a;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        canvas {
            border: none;
            outline: none;
            image-rendering: pixelated;
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
        }
        #status {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: #888;
            font-family: sans-serif;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div id="canvas-container">
        <canvas id="canvas" width="600" height="1024"></canvas>
    </div>
    <div id="status">Loading...</div>

    <script type="text/javascript">
        var Module = {
            preRun: [],
            postRun: [],
            print: function(text) {
                console.log(text);
            },
            printErr: function(text) {
                console.error(text);
            },
            canvas: document.getElementById('canvas'),
            setStatus: function(text) {
                document.getElementById('status').textContent = text;
            },
            totalDependencies: 0,
            monitorRunDependencies: function(left) {
                this.totalDependencies = Math.max(this.totalDependencies, left);
                this.setStatus(left ? 'Preparing... (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
            },
            locateFile: function(file) {
                // Help Emscripten find .wasm and .data files relative to the HTML
                return file;
            }
        };
        Module.setStatus('Downloading...');
        window.onerror = function(message, source, lineno, colno, error) {
            Module.setStatus('Exception thrown: ' + message);
            console.error('Error:', message, 'at', source, lineno, colno, error);
            Module.setStatus = function(text) {
                if (text) Module.printErr('[post-exception status] ' + text);
            };
        };
    </script>
    {{{ SCRIPT }}}
</body>
</html>
