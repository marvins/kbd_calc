# KBD-Calc Default Settings
# Copy this file to your config directory and customize as needed.
# Location depends on platform:
#   - SDL (macOS): ~/Library/Application Support/kbd_calc/settings.toml
#   - SDL (Linux): ~/.config/kbd_calc/settings.toml
#   - Pi Zero: /home/pi/.config/kbd_calc/settings.toml
#   - PicoCalc: /settings.toml (root of SD card)

[general]
# Time zone for clock display
# Options: "auto" (system default), "UTC", "America/New_York", "Europe/London", etc.
timezone = "auto"

# Display settings
[display]
# Brightness level (0-100)
brightness = 80

# Theme preference
# Options: "dark", "light", "auto"
theme = "dark"

# Calculator settings
[calculator]
# Angle mode for trigonometric functions
# Options: "degrees", "radians"
angle_mode = "degrees"

# Number format
# Options: "auto", "fixed", "scientific"
number_format = "auto"

# Decimal places when using fixed format (0-15)
decimal_places = 6

# UI settings
[ui]
# App to show on startup instead of the menu.
# Options: "menu", "status", "calculator", "settings"
default_app = "status"

# Highlight color for the focused/cursor node in the expression canvas
# Specified as a 24-bit RGB hex integer (e.g. 0xD8E8F8 = light blue-gray)
cursor_highlight_color = 14215416  # 0xD8E8F8

# Status page settings
[status]
# Update rate for clocks in milliseconds (default: 1000 = 1 second)
clock_update_ms = 1000

# Update rate for solar widget in milliseconds (default: 60000 = 1 minute)
solar_update_ms = 60000

# Location settings (used by solar calculator)
[location]
# Source for geographic location.
# "settings" - use the lat/lon/timezone values below
# "ip"       - auto-detect via ip-api.com (requires internet)
source    = "settings"
latitude  = 39.7392     # Replace with your coordinates
longitude = -104.9903
timezone  = -6.0        # UTC offset in hours (e.g. MDT=-6, MST=-7, EST=-5)
# URL queried when source = "ip" (must return ip-api.com-compatible JSON)
# ip_url = "http://ip-api.com/json"
